<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
<title id="title">Kamalampally Ruchith Reddy — Applied AI Engineer</title>
<desc id="desc">An editorial studio-style banner with warm ivory paper, forest green typography, terracotta accents and an abstract data-flow illustration.</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F0E6"/><stop offset="1" stop-color="#E9E3D6"/></linearGradient>
 <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".45" fill="#203D35" opacity=".12"/></pattern>
 <linearGradient id="terracotta" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#C76B4A"/><stop offset="1" stop-color="#D69A62"/></linearGradient>
 <clipPath id="frame"><rect x="1" y="1" width="1438" height="438" rx="22"/></clipPath>
</defs>
<g clip-path="url(#frame)">
 <rect width="1440" height="440" fill="url(#paper)"/>
 <rect width="1440" height="440" fill="url(#grain)"/>
 <path d="M58 54H1382" stroke="#25483D" stroke-opacity=".45"/>
 <text x="78" y="89" fill="#A95C40" font-family="monospace" font-size="13" letter-spacing="4">THE APPLIED INTELLIGENCE JOURNAL  /  01</text>
 <text x="76" y="188" fill="#193B32" font-family="Georgia, 'Times New Roman', serif" font-size="65" letter-spacing="-2">Kamalampally</text>
 <text x="76" y="260" fill="#193B32" font-family="Georgia, 'Times New Roman', serif" font-size="75" font-weight="bold" letter-spacing="-3">Ruchith Reddy</text>
 <path d="M80 286H670" stroke="url(#terracotta)" stroke-width="5"/>
 <text x="80" y="330" fill="#A95C40" font-family="monospace" font-size="18" letter-spacing="2.8">APPLIED AI  ·  GENERATIVE AI</text>
 <text x="80" y="365" fill="#52675D" font-family="Arial, sans-serif" font-size="17">Building useful software with language models, tools and thoughtful evaluation.</text>
 <text x="80" y="405" fill="#718077" font-family="monospace" font-size="11" letter-spacing="2">COMPUTER SCIENCE UNDERGRADUATE  /  CLASS OF 2028</text>
 <!-- editorial data-flow illustration -->
 <g transform="translate(1030 222)" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <circle r="155" stroke="#25483D" stroke-opacity=".18" stroke-width="1"/>
  <circle r="119" stroke="#25483D" stroke-opacity=".22" stroke-dasharray="2 8"/>
  <path d="M-185 -42C-120 -42 -108 -118 -38 -118S46 -36 105 -36 150 -96 190 -96" stroke="#25483D" stroke-width="2.2"/>
  <path d="M-185 48C-116 48 -102 112 -30 112S52 36 110 36 150 98 190 98" stroke="#C76B4A" stroke-width="2.2"/>
  <path d="M-38 -118V112M105 -36V36" stroke="#25483D" stroke-opacity=".3" stroke-dasharray="3 7"/>
  <g fill="#F5F0E6" stroke-width="3">
   <circle cx="-185" cy="-42" r="8" stroke="#C76B4A"/><circle cx="-38" cy="-118" r="9" stroke="#25483D"/>
   <circle cx="105" cy="-36" r="10" stroke="#C76B4A"/><circle cx="190" cy="-96" r="7" stroke="#25483D"/>
   <circle cx="-185" cy="48" r="8" stroke="#25483D"/><circle cx="-30" cy="112" r="9" stroke="#C76B4A"/>
   <circle cx="110" cy="36" r="10" stroke="#25483D"/><circle cx="190" cy="98" r="7" stroke="#C76B4A"/>
  </g>
  <circle r="28" fill="#25483D" fill-opacity=".08" stroke="#25483D" stroke-width="1.5"/>
  <path d="M-12 0H12M0 -12V12" stroke="#C76B4A" stroke-width="2"/>
  <circle r="42" stroke="#C76B4A" stroke-opacity=".4" stroke-dasharray="3 9"><animate attributeName="stroke-dashoffset" from="0" to="-48" dur="18s" repeatCount="indefinite"/></circle>
  <circle cx="105" cy="-36" r="17" stroke="#C76B4A" stroke-opacity=".5"><animate attributeName="r" values="13;20;13" dur="4s" repeatCount="indefinite"/></circle>
 </g>
 <g font-family="monospace" font-size="10" letter-spacing="1.5" fill="#52675D">
  <text x="1250" y="80">MODEL</text><text x="1250" y="98">→ TOOLS</text><text x="1250" y="116">→ OUTPUT</text>
  <text x="1250" y="134">→ EVALUATION</text>
 </g>
 <path d="M58 422H1382" stroke="#25483D" stroke-opacity=".45"/>
 <text x="1360" y="405" text-anchor="end" fill="#A95C40" font-family="monospace" font-size="11" letter-spacing="2">BUILD WITH PURPOSE</text>
</g>
<rect x="1" y="1" width="1438" height="438" rx="22" fill="none" stroke="#25483D" stroke-opacity=".45"/>
</svg>