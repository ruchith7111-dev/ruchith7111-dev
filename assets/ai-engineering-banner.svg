<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" role="img" aria-labelledby="title desc">
<title id="title">Kamalampally Ruchith Reddy | Applied AI Engineering</title>
<desc id="desc">A custom-built sci-fi engineering banner with a midnight navy grid, electric violet and ice-blue accents, orbital model nodes and a subtle animated signal sweep.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080B16"/><stop offset=".55" stop-color="#11182A"/><stop offset="1" stop-color="#101F30"/></linearGradient>
 <linearGradient id="electric" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A78BFA"/><stop offset=".52" stop-color="#62D7F5"/><stop offset="1" stop-color="#A6F0D2"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#6E7BFF" stop-opacity=".2"/><stop offset="1" stop-color="#6E7BFF" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#AFC5E8" stroke-opacity=".075"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="13"/></filter>
 <clipPath id="frame"><rect x="1" y="1" width="1438" height="458" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
