<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
<title id="title">Kamalampally Ruchith Reddy — AI Engineer | Applied AI and Generative AI</title>
<desc id="desc">A clean, futuristic AI engineering portfolio banner with a deep navy background, electric blue and purple highlights, bold typography and an abstract neural-network symbol.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080F20"/><stop offset=".56" stop-color="#111A35"/><stop offset="1" stop-color="#20183B"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#78D5FF"/><stop offset=".55" stop-color="#347BFF"/><stop offset="1" stop-color="#9A79FF"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#765BFF" stop-opacity="0"/><stop offset=".5" stop-color="#9C78FF" stop-opacity=".9"/><stop offset="1" stop-color="#765BFF" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8DBAFF" stroke-opacity=".075" stroke-width="1"/></pattern>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="1600" height="420" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1600" height="420" fill="url(#background)"/><rect width="1600" height="420" fill="url(#grid)"/>
  <circle cx="1330" cy="205" r="250" fill="#315DFF" opacity=".09"/><circle cx="1435" cy="120" r="190" fill="#A36BFF" opacity=".09"/>
  <path d="M64 62H1536" stroke="#5CAEFF" stroke-opacity=".42"/>
  <text x="82" y="96" fill="#86CFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="4.2">PERSONAL ENGINEERING PORTFOLIO / 2026</text>
  <text x="78" y="170" fill="#F4F7FF" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" letter-spacing="1.2">KAMALAMPALLY</text>
  <text x="78" y="226" fill="#F4F7FF" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" letter-spacing="1.2">RUCHITH REDDY</text>
  <text x="75" y="314" fill="url(#blue)" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="900" letter-spacing="2" filter="url(#textGlow)">AI ENGINEER</text>
  <rect x="82" y="337" width="7" height="30" rx="3.5" fill="#70C9FF"/>
  <text x="108" y="359" fill="#D9D4FF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="2.1">APPLIED AI • GENERATIVE AI</text>
  <text x="82" y="395" fill="#9AAACB" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" letter-spacing="2">CSE UNDERGRADUATE · CLASS OF 2028</text>
  <path d="M1120 350H1535" stroke="url(#purple)" stroke-width="2"/>
  <g transform="translate(1325 202)">
    <circle r="132" fill="none" stroke="#4C8EFF" stroke-opacity=".25" stroke-width="1.5"/>
    <circle r="106" fill="none" stroke="#9B7BFF" stroke-opacity=".48" stroke-width="1.5" stroke-dasharray="3 10"/>
    <circle r="78" fill="#111C3A" fill-opacity=".72" stroke="#4D91FF" stroke-opacity=".62"/>
    <!-- Abstract neural-network mark: no initials or letterform -->
    <g fill="none" stroke="url(#blue)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-55 -30L-20 -54L20 -36L55 -4L33 43L-10 58L-48 28L-55 -30Z" opacity=".95"/>
      <path d="M-20 -54L-10 2L33 43M20 -36L-10 2L-48 28M55 -4L-10 2" opacity=".8"/>
    </g>
    <g fill="#D8F4FF" stroke="#2E83FF" stroke-width="3" filter="url(#softGlow)">
      <circle cx="-55" cy="-30" r="9"/><circle cx="-20" cy="-54" r="8"/><circle cx="20" cy="-36" r="9"/>
      <circle cx="55" cy="-4" r="8"/><circle cx="33" cy="43" r="9"/><circle cx="-10" cy="58" r="8"/>
      <circle cx="-48" cy="28" r="8"/><circle cx="-10" cy="2" r="11" fill="#FFFFFF"/>
    </g>
    <path d="M-132 0H-113M113 0H132M0 -132V-113M0 113V132" stroke="#76CFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-106" r="6" fill="#78D5FF" filter="url(#softGlow)"/><circle cx="106" cy="0" r="6" fill="#A78BFF" filter="url(#softGlow)"/>
    <path d="M-132 0A132 132 0 0 1 0 -132" fill="none" stroke="#69C6FF" stroke-width="3" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/></path>
    <path d="M-106 0A106 106 0 0 0 0 106" fill="none" stroke="#9D7CFF" stroke-width="2" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="36s" repeatCount="indefinite"/></path>
  </g>
  <path d="M64 405H1536" stroke="#6B91FF" stroke-opacity=".35"/>
</g>
<rect x=".8" y=".8" width="1598.4" height="418.4" rx="24" fill="none" stroke="#6CAEFF" stroke-opacity=".35"/>
</svg>