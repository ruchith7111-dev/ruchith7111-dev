<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="270" viewBox="0 0 1440 270" role="img" aria-labelledby="title desc">
<title id="title">Kamalampally Ruchith Reddy — Applied AI</title>
<desc id="desc">A compact editorial portfolio banner with warm ivory paper, deep forest-green typography and a minimal terracotta data-flow illustration.</desc>
<defs>
