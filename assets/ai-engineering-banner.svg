<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title desc">
<title id="title">Kamalampally Ruchith Reddy — The Applied Intelligence Journal</title>
<desc id="desc">A distinctive editorial portfolio banner in warm paper, ink navy, muted teal and burnt coral. A flowing data contour illustration connects model, tools and evaluation.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#F7F3EA"/><stop offset="1" stop-color="#EAE5D9"/>
  </linearGradient>
  <linearGradient id="coral" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#B85F49"/><stop offset="1" stop-color="#D28B65"/>
  </linearGradient>
  <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
    <circle cx="1.2" cy="1.2" r=".5" fill="#223B46" opacity=".12"/>
  </pattern>
  <pattern id="finegrid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#385B5D" stroke-opacity=".07"/>
  </pattern>
  <clipPath id="frame"><rect x="1" y="1" width="1438" height="428" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1440" height="430" fill="url(#paper)"/>
  <rect width="1440" height="430" fill="url(#grain)"/>
  <rect x="0" y="0" width="1440" height="430" fill="url(#finegrid)"/>
  <path d="M62 48H1378" stroke="#203B43" stroke-opacity=".35"/>
  <text x="76" y="79" fill="#A65342" font-family="monospace" font-size="12" letter-spacing="3.5">FIELD NOTES  /  01     APPLIED INTELLIGENCE</text>
  <text x="72" y="184" fill="#1E343C" font-family="Georgia, 'Times New Roman', serif" font-size="62" letter-spacing="-2">Kamalampally</text>
  <text x="72" y="251" fill="#1E343C" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="bold" letter-spacing="-2.8">Ruchith Reddy</text>
  <path d="M78 279H650" stroke="url(#coral)" stroke-width="4"/>
  <text x="78" y="319" fill="#A65342" font-family="monospace" font-size="17" letter-spacing="2.4">APPLIED AI  ·  GENERATIVE AI</text>
  <text x="78" y="354" fill="#50656A" font-family="Arial, Helvetica, sans-serif" font-size="17">Building useful software with models, tools and thoughtful evaluation.</text>
  <text x="78" y="394" fill="#75827C" font-family="monospace" font-size="11" letter-spacing="1.8">COMPUTER SCIENCE  /  CLASS OF 2028  /  INDIA</text>

  <!-- Abstract data contour: editorial illustration, not a sci-fi HUD -->
  <g transform="translate(1035 218)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-226 -94C-159 -170 -72 -157 -22 -90S85 -10 216 -106" stroke="#56736D" stroke-opacity=".18" stroke-width="1.5"/>
    <path d="M-231 -44C-152 -121 -80 -112 -20 -49S95 40 223 -57" stroke="#56736D" stroke-opacity=".27" stroke-width="1.5"/>
    <path d="M-236 8C-164 -69 -75 -61 -16 4S89 92 220 -5" stroke="#B85F49" stroke-opacity=".55" stroke-width="2"/>
    <path d="M-226 62C-148 -11 -72 -8 -14 57S92 144 224 47" stroke="#56736D" stroke-opacity=".35" stroke-width="1.5"/>
    <path d="M-184 112C-110 53 -49 54 9 108S115 185 196 112" stroke="#56736D" stroke-opacity=".2" stroke-width="1.5"/>
    <path d="M-178 -134C-92 -50 -70 25 -20 87S94 167 170 176" stroke="#56736D" stroke-opacity=".17" stroke-dasharray="3 8"/>
    <g fill="#F7F3EA" stroke-width="2.5">
      <circle cx="-226" cy="-94" r="7" stroke="#B85F49"/>
      <circle cx="-20" cy="-90" r="8" stroke="#355D58"/>
      <circle cx="85" cy="-10" r="9" stroke="#B85F49"/>
      <circle cx="216" cy="-106" r="6" stroke="#355D58"/>
      <circle cx="-236" cy="8" r="7" stroke="#355D58"/>
      <circle cx="-16" cy="4" r="8" stroke="#B85F49"/>
      <circle cx="89" cy="92" r="9" stroke="#355D58"/>
      <circle cx="220" cy="-5" r="6" stroke="#B85F49"/>
    </g>
    <circle cx="85" cy="-10" r="19" stroke="#B85F49" stroke-opacity=".3">
      <animate attributeName="r" values="15;23;15" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".2;.55;.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <path d="M-236 8C-164 -69 -75 -61 -16 4S89 92 220 -5" stroke="#B85F49" stroke-width="2.4" stroke-dasharray="5 16" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="0" to="-84" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-family="monospace" font-size="10" letter-spacing="1.6" fill="#65766F">
    <text x="1285" y="91" text-anchor="end">MODEL</text>
    <text x="1285" y="110" text-anchor="end">TOOLS</text>
    <text x="1285" y="129" text-anchor="end">EVALUATION</text>
    <text x="1285" y="148" text-anchor="end">APPLICATION</text>
  </g>
  <path d="M62 416H1378" stroke="#203B43" stroke-opacity=".35"/>
  <text x="1360" y="399" text-anchor="end" fill="#A65342" font-family="monospace" font-size="10" letter-spacing="2">MAKE IT USEFUL</text>
</g>
<rect x="1" y="1" width="1438" height="428" rx="18" fill="none" stroke="#355D58" stroke-opacity=".45"/>
</svg>