<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">Kamalampally Ruchith Reddy — Applied AI Systems</title>
<desc id="desc">An original scientific editorial interface with a dark instrument panel, typographic identity, and an animated neural systems map.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080A12"/><stop offset=".56" stop-color="#101522"/><stop offset="1" stop-color="#17152A"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9D8CFF"/><stop offset="1" stop-color="#78DCE8"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#7668D9" stop-opacity=".22"/><stop offset="1" stop-color="#7668D9" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#A7B4D0" stroke-opacity=".075" stroke-width="1"/></pattern>
 <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#A99BFF" opacity=".45"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="11"/></filter>
</defs>
<rect width="1400" height="410" rx="18" fill="url(#bg)"/><rect width="1400" height="410" rx="18" fill="url(#grid)"/>
<ellipse cx="1090" cy="190" rx="330" ry="270" fill="url(#aura)"/>
<path d="M48 32H1352M48 378H1352" stroke="#A99BFF" stroke-opacity=".42"/>
<path d="M48 32v18M1352 32v18M48 378v-18M1352 378v-18" stroke="#78DCE8" stroke-width="2"/>
<g font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace">
 <text x="76" y="75" fill="#A99BFF" font-size="12" letter-spacing="3.5">APPLIED INTELLIGENCE / PERSONAL ENGINEERING PROFILE</text>
 <text x="72" y="190" fill="#F3F1FA" font-size="59" font-weight="700" letter-spacing="-2">RUCHITH</text>
 <text x="72" y="250" fill="#F3F1FA" font-size="59" font-weight="700" letter-spacing="-2">REDDY</text>
 <rect x="76" y="270" width="360" height="2" fill="url(#violet)"/>
 <text x="76" y="308" fill="#78DCE8" font-size="17" letter-spacing="2.4">AI ENGINEERING</text>
 <text x="76" y="338" fill="#B8C0D4" font-size="13" letter-spacing="1.2">APPLIED AI  /  GENERATIVE AI  /  LLM SYSTEMS</text>
 <text x="76" y="370" fill="#78839B" font-size="11" letter-spacing="1.8">CSE UNDERGRADUATE  ·  2028  ·  INDIA</text>
 <text x="1320" y="75" text-anchor="end" fill="#78839B" font-size="10" letter-spacing="2">SYSTEM MAP / 001</text>
</g>
<!-- Neural system map -->
<g transform="translate(1035 210)">
 <circle r="145" fill="none" stroke="#9D8CFF" stroke-opacity=".18" stroke-dasharray="2 8"/>
 <circle r="112" fill="none" stroke="#78DCE8" stroke-opacity=".17"/>
 <circle r="78" fill="none" stroke="#9D8CFF" stroke-opacity=".25" stroke-dasharray="4 8"/>
 <g fill="none" stroke="#91A0C5" stroke-opacity=".58" stroke-width="1.4">
  <path d="M-145 -58L-73 -104L-8 -50L72 -112L145 -48L98 35L35 91L-58 78L-132 20L-145 -58"/>
  <path d="M-73 -104L-58 78M-8 -50L98 35M72 -112L35 91M-132 20L98 35M-145 -58L145 -48M-8 -50L-132 20"/>
 </g>
 <g fill="#101522" stroke="#A99BFF" stroke-width="2">
  <circle cx="-145" cy="-58" r="6"/><circle cx="-73" cy="-104" r="7"/><circle cx="-8" cy="-50" r="9"/><circle cx="72" cy="-112" r="6"/><circle cx="145" cy="-48" r="7"/><circle cx="98" cy="35" r="9"/><circle cx="35" cy="91" r="6"/><circle cx="-58" cy="78" r="8"/><circle cx="-132" cy="20" r="6"/>
 </g>
 <circle r="19" fill="#78DCE8" opacity=".12" filter="url(#glow)"/>
 <circle r="8" fill="#78DCE8"><animate attributeName="r" values="6;9;6" dur="3s" repeatCount="indefinite"/></circle>
 <circle r="28" fill="none" stroke="#78DCE8" stroke-opacity=".6"><animate attributeName="r" values="22;36;22" dur="4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".65;.08;.65" dur="4s" repeatCount="indefinite"/></circle>
 <path d="M-145 -58L-73 -104L-8 -50L72 -112L145 -48" fill="none" stroke="#78DCE8" stroke-width="2" stroke-dasharray="7 14" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-84" dur="7s" repeatCount="indefinite"/></path>
</g>
<g font-family="monospace" font-size="10" letter-spacing="1.5" fill="#B8C0D4">
 <rect x="790" y="340" width="500" height="24" rx="3" fill="url(#dots)" opacity=".75"/>
 <text x="806" y="356">MODEL</text><text x="910" y="356">CONTEXT</text><text x="1035" y="356">TOOLS</text><text x="1132" y="356">EVALUATION</text><text x="1320" y="356" text-anchor="end" fill="#78DCE8">LOOP / ACTIVE</text>
</g>
<rect x="1" y="1" width="1398" height="408" rx="18" fill="none" stroke="url(#violet)" stroke-opacity=".48"/>
</svg>