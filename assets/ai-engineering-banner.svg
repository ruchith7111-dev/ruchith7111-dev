   <circle cx="-142" cy="-58" r="6"/><circle cx="-91" cy="-112" r="7"/><circle cx="-15" cy="-71" r="8"/><circle cx="59" cy="-130" r="6"/><circle cx="139" cy="-55" r="7"/><circle cx="119" cy="50" r="8"/><circle cx="36" cy="112" r="6"/><circle cx="-58" cy="88" r="8"/><circle cx="-132" cy="24" r="6"/>
  </g>
