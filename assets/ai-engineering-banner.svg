  <circle r="78" stroke="#A78BFA" stroke-opacity=".35" stroke-dasharray="3 8"/>
  <g stroke="#A8BCD9" stroke-opacity=".58" stroke-width="1.5">
   <path d="M-142 -58L-91 -112L-15 -71L59 -130L139 -55L119 50L36 112L-58 88L-132 24Z"/>
