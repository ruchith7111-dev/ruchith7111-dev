  <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D9FF83"/><stop offset="1" stop-color="#75E7D1"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#A7E96B" stop-opacity=".18"/><stop offset="1" stop-color="#A7E96B" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C8E7D7" stroke-opacity=".07"/></pattern>
  <pattern id="micro" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#D9FF83" opacity=".4"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
  <clipPath id="clip"><rect x="1" y="1" width="1398" height="428" rx="18"/></clipPath>
</defs>
