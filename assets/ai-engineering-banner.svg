  <path d="M-142 -58L-91 -112L-15 -71L59 -130L139 -55" stroke="#A78BFA" stroke-width="2" stroke-dasharray="7 14"><animate attributeName="stroke-dashoffset" from="0" to="-84" dur="7s" repeatCount="indefinite"/></path>
