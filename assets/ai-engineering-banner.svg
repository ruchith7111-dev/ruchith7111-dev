<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
<title id="title">Kamalampally Ruchith Reddy — Applied AI Engineer</title>
<desc id="desc">A bold neo-editorial portfolio banner with deep ink background, vivid chartreuse and cyan accents, oversized typography, and a distinctive abstract intelligence mark.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101B2D"/><stop offset=".58" stop-color="#17283A"/><stop offset="1" stop-color="#203D46"/></linearGradient>
 <linearGradient id="acid" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D8FF63"/><stop offset="1" stop-color="#91E8B5"/></linearGradient>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#B9D3D7" stroke-opacity=".075" stroke-width="1"/></pattern>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="clip"><rect width="1600" height="360" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
 <rect width="1600" height="360" fill="url(#bg)"/>
 <rect width="1600" height="360" fill="url(#grid)"/>
 <path d="M72 54H1528" stroke="#D8FF63" stroke-opacity=".65"/>
 <text x="82" y="91" fill="#D8FF63" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="4.5">PERSONAL ENGINEERING PORTFOLIO  /  2026</text>
 <text x="76" y="183" fill="#F5F7F2" font-family="Georgia, 'Times New Roman', serif" font-size="70" letter-spacing="-2.5">Kamalampally</text>
 <text x="76" y="255" fill="#F5F7F2" font-family="Georgia, 'Times New Roman', serif" font-size="70" letter-spacing="-2.5">Ruchith Reddy<tspan fill="#D8FF63">.</tspan></text>
 <rect x="82" y="282" width="8" height="28" rx="4" fill="#D8FF63"/>
 <text x="108" y="303" fill="#B9D3D7" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3">APPLIED AI  /  GENERATIVE AI</text>
 <text x="1518" y="308" text-anchor="end" fill="#B9D3D7" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.5">CSE UNDERGRADUATE · CLASS OF 2028</text>
 <g transform="translate(1280 166)">
  <circle r="112" fill="none" stroke="#D8FF63" stroke-opacity=".26" stroke-width="1.5"/>
  <circle r="86" fill="none" stroke="#72D8D0" stroke-opacity=".4" stroke-width="1.5" stroke-dasharray="3 9"/>
  <path d="M-62 54V-54H-39L38 34V-54H62V54H39L-38 -34V54Z" fill="none" stroke="url(#acid)" stroke-width="12" stroke-linejoin="round"/>
  <path d="M-110 0H-86M86 0H110M0 -110V-86M0 86V110" stroke="#72D8D0" stroke-width="3"/>
  <circle cx="0" cy="-86" r="7" fill="#D8FF63" filter="url(#glow)"/>
  <circle cx="86" cy="0" r="6" fill="#72D8D0"/>
  <circle cx="-86" cy="0" r="6" fill="#72D8D0"/>
  <path d="M-112 0A112 112 0 0 1 0 -112" fill="none" stroke="#D8FF63" stroke-width="3" stroke-linecap="round">
   <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
  </path>
 </g>
 <path d="M72 334H1528" stroke="#D8FF63" stroke-opacity=".4"/>
 <text x="82" y="350" fill="#72D8D0" font-family="monospace" font-size="10" letter-spacing="2">THINK CLEARLY  ·  BUILD PRACTICALLY  ·  VERIFY EVERYTHING</text>
</g>
<rect x=".8" y=".8" width="1598.4" height="358.4" rx="22" fill="none" stroke="#72D8D0" stroke-opacity=".35"/>
</svg>