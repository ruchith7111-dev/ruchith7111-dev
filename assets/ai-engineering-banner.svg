<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
<title id="title">Kamalampally Ruchith Reddy — Applied AI Engineering</title>
<desc id="desc">An original orbital systems interface in graphite, signal-lime and ice-cyan, with animated scan lines and a pulsing model network.</desc>
<defs>
