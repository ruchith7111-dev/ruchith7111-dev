 <path d="M58 54H1382M58 405H1382" stroke="#8D9BF4" stroke-opacity=".42"/>
 <path d="M58 54v18M1382 54v18M58 405v-18M1382 405v-18" stroke="#62D7F5" stroke-width="2"/>
